name: Refresh Template

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Run longlink init
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Refresh generated template
        run: uvx --python 3.14 "longlink>=0.1.38" init --folder .

      - name: Open pull request for changes
        uses: peter-evans/create-pull-request@v8
        with:
          branch: longlink/init-refresh
          delete-branch: true
          title: Refresh LongLink template
          commit-message: Refresh LongLink template
          body: |
            Regenerated this repository with:

            ```sh
            uvx --python 3.14 "longlink>=0.1.38" init --folder .
            ```

            This pull request is only opened when the command produces changes.
